server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que empiece con /api va a la API (contenedor "api" del docker-compose).
    # Se resuelve con el DNS interno de Docker en cada pedido: si la API se reinicia no hace falta reiniciar nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        proxy_pass $api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre (main-XXXX.js, etc.): se pueden guardar mucho tiempo en el navegador.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cualquier otra ruta es de Angular (/login, /inscripciones...): se devuelve index.html y el router resuelve.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
