<div class="barra">

  @if (esAdmin) {
    <button mat-raised-button color="primary" (click)="agregarAlumno()">
      Nuevo alumno
    </button>
  }

  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar</mat-label>
    <input matInput [formControl]="busqueda" placeholder="Nombre o email">
  </mat-form-field>

</div>

<div class="table-shell" role="region" aria-label="Listado de alumnos" tabindex="0">
<table mat-table [dataSource]="alumnos" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let alumno"> {{ alumno.id }} </td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let alumno"> {{ alumno.nombre }} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> Email </th>
    <td mat-cell *matCellDef="let alumno"> {{ alumno.email }} </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let alumno">
      <button mat-button color="primary" (click)="editarAlumno(alumno)">Editar</button>
      <button mat-button color="warn"    (click)="eliminar(alumno)">Eliminar</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Estado sin resultados (o cargando) -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell sin-resultados" [attr.colspan]="displayedColumns.length">
      {{ cargando ? 'Cargando alumnos...' : 'No se encontraron alumnos.' }}
    </td>
  </tr>

</table>

<mat-paginator
  [length]="totalCount"
  [pageIndex]="page - 1"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  (page)="onPage($event)"
  showFirstLastButtons>
</mat-paginator>
</div>
