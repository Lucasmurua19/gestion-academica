<section class="auth-layout" aria-labelledby="register-title">
  <form class="auth-form" (ngSubmit)="registrarse()">
    <h1 id="register-title">Crear cuenta</h1>
    <mat-form-field appearance="outline"><mat-label>Nombre</mat-label><input matInput [(ngModel)]="nombre" name="nombre" autocomplete="name" required></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" [(ngModel)]="email" name="email" autocomplete="email" required></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Contraseña</mat-label><input matInput type="password" [(ngModel)]="password" name="password" autocomplete="new-password" required></mat-form-field>
    <p class="error" *ngIf="error" role="alert">{{ error }}</p>
    <button class="auth-submit" mat-raised-button color="primary" type="submit" [disabled]="!nombre || !email || !password">Registrarse</button>
    <p class="auth-switch">¿Ya tenés cuenta? <a routerLink="/login">Iniciar sesión</a></p>
  </form>
</section>
