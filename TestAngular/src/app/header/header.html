<header class="sidebar">
  <a routerLink="/home" class="brand" aria-label="Aula, inicio">Aula</a>
  <nav aria-label="Navegación principal">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" #inicio="routerLinkActive" [class.active]="inicio.isActive || router.url === '/'" ariaCurrentWhenActive="page"><svg aria-hidden="true"><use href="/icons.svg#home" /></svg> Inicio</a>
    <a routerLink="/dashboardA" routerLinkActive="active" ariaCurrentWhenActive="page"><svg aria-hidden="true"><use href="/icons.svg#people" /></svg> Alumnos</a>
    <a routerLink="/dashboardB" routerLinkActive="active" ariaCurrentWhenActive="page"><svg aria-hidden="true"><use href="/icons.svg#book" /></svg> Materias</a>
    <a routerLink="/inscripciones" routerLinkActive="active" ariaCurrentWhenActive="page"><svg aria-hidden="true"><use href="/icons.svg#enroll" /></svg> Inscripciones</a>
    <a routerLink="/dashboard-academico" routerLinkActive="active" ariaCurrentWhenActive="page"><svg aria-hidden="true"><use href="/icons.svg#chart" /></svg> Resumen</a>
  </nav>
  <div class="account">
    <ng-container *ngIf="!authService.estaLogueado(); else logueado">
      <a routerLink="/login" class="session-link">Iniciar sesión</a>
      <a routerLink="/registro" class="register-link">Registrarse</a>
    </ng-container>
    <ng-template #logueado>
      <span class="usuario">{{ authService.getUsuario()?.nombre }} ({{ authService.getUsuario()?.rol }})</span>
      <button class="logout" (click)="logout()">Cerrar sesión</button>
    </ng-template>
  </div>
</header>
