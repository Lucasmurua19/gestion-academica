 <h2 mat-dialog-title>{{ data.materia ? 'Editar materia' : 'Nueva materia' }}</h2>

    <form [formGroup]="form" (ngSubmit)="confirmar()">

    <mat-dialog-content>

      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" placeholder="Nombre">
        <mat-error>{{ mensaje() }}</mat-error>
      </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions align="end">

      <button mat-button type="button" (click)="cancelar()">Cancelar</button>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || guardando">
        {{ data.materia ? 'Guardar' : 'Agregar' }}
      </button>

    </mat-dialog-actions>

    </form>
