<div class="barra">

  @if (esAdmin) {
    <button mat-raised-button color="primary" (click)="agregarMateria()">
      Nueva materia
    </button>
  }

  <mat-form-field appearance="outline" class="filtro">
    <mat-label>Buscar</mat-label>
    <input matInput [formControl]="busqueda" placeholder="Nombre de la materia">
  </mat-form-field>

</div>

<div class="table-shell" role="region" aria-label="Listado de materias" tabindex="0">
<table mat-table [dataSource]="materia" class="mat-elevation-z8">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>

    <td mat-cell *matCellDef="let materia"> {{ materia.id }} </td>

  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef> Nombre </th>
    <td mat-cell *matCellDef="let materia"> {{ materia.nombre }} </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef> Acciones </th>
    <td mat-cell *matCellDef="let materia">
      <button mat-button color="primary" (click)="editarMateria(materia)">Editar</button>
      <button mat-button color="warn"    (click)="eliminar(materia)">Eliminar</button>
    </td>
  </ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  <!-- Estado sin resultados (o cargando) -->
  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell sin-resultados" [attr.colspan]="displayedColumns.length">
      {{ cargando ? 'Cargando materias...' : 'No se encontraron materias.' }}
    </td>
  </tr>

</table>

<mat-paginator
  [length]="totalCount"
  [pageIndex]="page - 1"
  [pageSize]="pageSize"
  [pageSizeOptions]="pageSizeOptions"
  (page)="onPage($event)"
  showFirstLastButtons>
</mat-paginator>
</div>
