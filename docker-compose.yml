# Sistema completo en contenedores:  docker compose up --build -d   ->  http://localhost:8080
#
#   web  (nginx + Angular)  ──/api──▶  api  (.NET 8)  ──▶  db  (SQL Server 2022)
#
# Los valores por defecto son de DEMOSTRACIÓN. Para cambiarlos, copiá .env.example a .env y editalo.

name: gestion-academica

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express          # edición gratuita y liviana
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Demo_Passw0rd_2026}
    volumes:
      - sqldata:/var/opt/mssql    # los datos sobreviven a "docker compose down" (se borran con "down -v")
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    # No se publica el puerto 1433 a propósito: así no choca con un SQL Server instalado en la compu.

  api:
    build:
      context: .
      dockerfile: CLASE_ORM/Dockerfile
    image: gestion-academica-api:demo
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Con: "Server=db;Database=Practico;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Demo_Passw0rd_2026};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:-clave-de-demostracion-docker-compose-cambiar-en-serio}
      Database__MigrateOnStartup: "true"     # crea la base y aplica las migraciones al arrancar
      Swagger__Enabled: "true"               # Swagger en http://localhost:5201/swagger
      AdminSeed__Nombre: Administrador
      AdminSeed__Email: ${ADMIN_EMAIL:-admin@demo.local}
      AdminSeed__Password: ${ADMIN_PASSWORD:-Admin_Demo_2026}
    ports:
      - "${API_PORT:-5201}:8080"

  web:
    build:
      context: ./TestAngular
    image: gestion-academica-web:demo
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Datos de ejemplo (opcional):  docker compose run --rm seed
  seed:
    profiles: ["seed"]
    image: curlimages/curl:8.11.1
    depends_on:
      - api
    environment:
      API_URL: http://api:8080/api
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@demo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin_Demo_2026}
    volumes:
      - ./docker/seed-demo.sh:/seed-demo.sh:ro
    # tr quita los saltos de línea de Windows (CRLF) por si Git convirtió el script al clonarlo.
    entrypoint: ["sh", "-c", "tr -d '\\r' < /seed-demo.sh | sh"]

volumes:
  sqldata:
